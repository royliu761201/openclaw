  - name: "Patterns"
    full_name: "Patterns (Cell Press)"
    tier: "SCI-Q1"
    impact_factor: "6.5" 
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/elsevier"
    url: "https://www.cell.com/patterns/home"
    appendix: "STAR Methods (Structured Transparent Accessible Reporting)"
    structure: ["Summary", "Intro", "Results", "Discussion", "STAR Methods"]
    preferences: ["Data Science", "AI Infrastructure", "Open Data"]

  # --- IEEE TRANSACTIONS (CCF-A / Q1) ---
  - name: "TPAMI"
    full_name: "IEEE Transactions on Pattern Analysis and Machine Intelligence"
    tier: "CCF-A / Q1"
