venues:
  # --- MULTIDISCIPLINARY / PRESTIGE (SCI-Q1 Top) ---
  - name: "Nature"
    full_name: "Nature"
    tier: "SCI-Q1 (Top)"
    impact_factor: "50.5"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/nature"
    url: "https://www.nature.com/nature"
    requirements:
      page_limit: "Main Text ~3000 words (6-8 pages)"
      anonymity: "Single Blind"
      format: "Word/LaTeX (nature.cls)"
    appendix: "Supplementary Information (SI) allowed"
    structure: 
      - "Abstract (Unlabeled, ~150 words)"
      - "Introduction (No header)"
      - "Results (broken into subheaders)"
      - "Discussion"
      - "Methods (at the end)"
      - "Data Availability"
    section_reqs:
      methods: "Unlimited length, but concise"
      data: "Mandatory Data Availability Statement"
    preferences: ["Breakthrough Science", "General Interest", "AI for Science"]
    review_cycle: "5-6 months (High Rejection Rate)"

  - name: "Science"
    full_name: "Science"
    tier: "SCI-Q1 (Top)"
    impact_factor: "44.7"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/science"
    url: "https://www.science.org/"
    requirements:
      page_limit: "~4500 words"
      anonymity: "Single Blind"
    appendix: "Supplementary Materials allowed"
    structure:
      - "Abstract (~125 words)"
      - "Main Text (Intro + Results + Discussion mixed)"
      - "Materials and Methods (in SM or separate)"
    preferences: ["Breakthrough Science", "Original Research"]

  - name: "PNAS"
    full_name: "Proceedings of the National Academy of Sciences"
    tier: "SCI-Q1"
    impact_factor: "9.6"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/pnas"
    url: "https://www.pnas.org/"
    structure:
      - "Significance Statement (120 words)"
      - "Abstract"
      - "Introduction"
      - "Results"
      - "Discussion"
      - "Materials and Methods"
    preferences: ["Broad Scientific Impact", "Biological/Physical/Social Sciences"]

  # --- NATURE/SCIENCE FAMILY (AI & ROBOTICS) ---
  - name: "Nature Machine Intelligence"
    full_name: "Nature Machine Intelligence"
    tier: "SCI-Q1"
    impact_factor: "18.8"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/nature"
    url: "https://www.nature.com/natmachintell"
    requirements:
      page_limit: "Flexible (approx 2000-4000 words + Methods)"
      anonymity: "Single Blind"
    appendix: "Supplementary Information allowed"
    structure:
      - "Abstract"
      - "Introduction"
      - "Results"
      - "Discussion"
      - "Methods"
    section_reqs:
      code: "Code Availability Statement required"
    preferences: ["Interdisciplinary", "AI for Science", "Ethical AI", "Robotics"]
    review_cycle: "~4-6 months (First Decision > 40 days)"

  - name: "Nature Communications"
    full_name: "Nature Communications"
    tier: "SCI-Q1"
    impact_factor: "14.7"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/nature"
    url: "https://www.nature.com/ncomms"
    appendix: "SI allowed"
    structure: ["Abstract", "Intro", "Results", "Discussion", "Methods"]
    preferences: ["High Impact", "Open Access", "Multidisciplinary"]

  - name: "Nature Biomedical Engineering"
    full_name: "Nature Biomedical Engineering"
    tier: "SCI-Q1"
    impact_factor: "26.8"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/nature"
    url: "https://www.nature.com/natbiomedeng"
    structure: ["Abstract", "Intro", "Results", "Discussion", "Methods"]
    preferences: ["Biomedical AI", "Medical Devices", "Bioinformatics"]

  - name: "Science Robotics"
    full_name: "Science Robotics"
    tier: "SCI-Q1"
    impact_factor: "26.1"
    type: "Journal"
    deadline: "Rolling Submission"
    template_path: "paper/science"
    url: "https://www.science.org/journal/scirobotics"
