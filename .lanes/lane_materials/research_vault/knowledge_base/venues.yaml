  # --- MACHINE LEARNING CONFERENCES (CCF-A) ---
  - name: "NeurIPS"
    full_name: "Conference on Neural Information Processing Systems"
    tier: "CCF-A"
    type: "Conference"
    deadline: "2025-05-21T20:00:00Z"
    template_path: "paper/neurips"
    url: "https://neurips.cc"
    requirements:
      page_limit: "9 pages (main content)"
      anonymity: "Double Blind"
      format: "LaTeX (neurips_202X.sty)"
    appendix: "Allowed (separate file or end of PDF, checked by reviewers)"
    structure: ["Abstract", "Intro", "Related Work", "Method", "Exp", "Conclusion", "Impact Statement"]
    section_reqs:
      checklist: "Paper Checklist required at end"
      broader_impact: "Mandatory section"
    preferences: ["Theoretical ML", "Deep Learning", "Generative Models", "Reinforcement Learning"]
    review_cycle: "3-4 months (Fixed Date)"

  - name: "ICML"
    full_name: "International Conference on Machine Learning"
    tier: "CCF-A"
    type: "Conference"
    deadline: "2025-01-30T20:00:00Z" 
    template_path: "paper/icml"
    url: "https://icml.cc"
    requirements:
      page_limit: "8 pages (main content)"
      anonymity: "Double Blind"
    appendix: "Allowed (separate submission)"
    structure: ["Abstract", "Intro", "Method", "Exp", "Conclusion"]
    section_reqs:
      impact: "Impact Statement required"
    preferences: ["Machine Learning Algorithms", "Optimization", "Learning Theory", "Trustworthy AI"]

  - name: "ICLR"
    full_name: "International Conference on Learning Representations"
    tier: "Top-Tier" 
    type: "Conference"
    deadline: "2025-10-01T23:59:00Z" # Est
    template_path: "paper/iclr"
    url: "https://iclr.cc"
    requirements:
      page_limit: "9 pages recommended"
      anonymity: "Double Blind"
    appendix: "Allowed (end of PDF)"
    structure: ["Abstract", "Intro", "Related Work", "Method", "Exp", "Conclusion"]
    preferences: ["Representation Learning", "Deep Learning", "Generative AI", "Vision-Language"]
    review_cycle: "3-4 months (Open Review)"

